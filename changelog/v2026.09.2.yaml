version: v2026.09.2
date: 2026-09-10
entries:
  - category: 修复
    user: 修复看板时效策略卡片点进去后，工单列表条数与卡片「在途」数字对不上
    full: 数据看板「时效策略」卡片的大数字统计的是在途工单，但此前点击整卡跳转到工单列表时没有过滤已完结工单，列表里混入了已完结单，条数比卡片数字多。现在下钻链接自动带上全部未完结状态（未分配、已分配、处理中、即将超时、已超时）的筛选，落地列表与卡片数字严格一致；筛选面板如实显示这五个状态，可逐项摘除。
    page: /dashboard
  - category: 改进
    user: 开放数据分析 API 接入文档重写，更通俗、可照着 curl 跑通；接口元信息与报错同步补齐
    full: /docs/analytics 接入文档按认证、限流、错误、分页、增量同步、注意事项分节重写，补充 API key 的获取路径与 curl 示例，删去内部实现行话。同时按真实接入实测修复六处消费方缺口：工单字段筛选参数列出全部 65 个合法值（非法值报错会附上合法清单）、参数错误信息格式修正、接口元信息补保单号状态枚举、发现接口标注仅有的三个公开端点、文档补录 /api/v1/me 接口、分页说明注明返回的是相对路径。
  - category: 内部
    user: 基础设施：数据湖可只读直连生产数据库
    full: 生产数据库新增 etl_ro 只读角色，仅开放工单域 12 张表白名单（不含账号、密钥与审计数据），供数据湖直连同步；角色默认无口令即无法登录，来源限制由云安全组承担。应用功能与界面无变化。
