# InsureDesk single-machine production deployment.
#
# Three services: postgres + api + a daily backup sidecar. The API serves both
# the tRPC API and the built web SPA (@fastify/static), and binds only to
# 127.0.0.1:3000 — the host's existing nginx reverse-proxies public traffic to
# it (HTTPS/domain live there, not here). No nginx container. The backup sidecar
# dumps Postgres to the host on a schedule; see its service block.
#
# The api service runs the release image pinned by IMAGE_TAG in the server-side
# .env. `make upgrade` resolves the latest CalVer, backs up, then rewrites
# IMAGE_TAG + pulls + `up -d`. The build: section is the restricted-network
# fallback: checkout the same tag and `up -d --build` produces the same
# artifact under the same image name.
#
# Config comes from a hand-created server-side .env (see .env.example), never
# committed. Every api start runs `prisma migrate deploy` + the idempotent
# bootstrap (initial admin admin/admin — change the password right after first
# deploy) before serving; a failed migration fails the container, so check
# `docker logs insuredesk-api-prod`.
#
# Deploy runbook: docs/deployment.md. Release/upgrade runbook: docs/releasing.md.

services:
  insuredesk-db-prod:
    image: postgres:17-alpine
    container_name: insuredesk-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 不设 TZ/PGTZ：会话时区的权威来源是迁移 20260826000000 的 ALTER DATABASE
      # （adapter-pg 无偏移序列化要求会话为 UTC）；TZ/PGTZ 只在 initdb 时生效一次，
      # 设了反而让新卷带上非 UTC 默认、且误导人以为它是生效途径。
    ports:
      # Published for the ops data-lake ETL pull (ADR docs/adr/0004). Source
      # restriction is the cloud security group's job — Docker publishes ports
      # via its own iptables chains, so ufw/firewalld never see this traffic.
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  insuredesk-api-prod:
    # Pinned release image (GHCR is private — `docker login ghcr.io` with a PAT
    # before pulling). With both image: and build: present, Compose only builds
    # when asked (`--build`); normal upgrades run `make upgrade` (pull + up -d).
    image: ghcr.io/lkxpro/insuredesk-api:${IMAGE_TAG:?set IMAGE_TAG in .env, see docs/releasing.md}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Registry/engine mirrors default to official sources. On a restricted
      # network (mainland China), set NPM_REGISTRY / PRISMA_ENGINES_MIRROR in
      # .env — Compose interpolates them here at build time. See docs/deployment.md.
      args:
        # Restricted-network fallback for version injection: same IMAGE_TAG as
        # image:, so a --build artifact claims the same version as the release image.
        APP_VERSION: ${IMAGE_TAG}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-https://binaries.prisma.sh}
    container_name: insuredesk-api-prod
    restart: unless-stopped
    # Runtime env (DATABASE_URL, SESSION_SECRET, etc.) from the server-side .env.
    # DATABASE_URL must point at the compose service name `insuredesk-db-prod`,
    # not localhost.
    env_file:
      - .env
    ports:
      # Bind to loopback only — host nginx reverse-proxies to this. Never 0.0.0.0.
      - "127.0.0.1:3000:3000"
    depends_on:
      insuredesk-db-prod:
        condition: service_healthy

  # Service key is `backup` (not insuredesk-backup-prod like its siblings) so the
  # documented `docker compose run --rm backup once` works — run/exec address the
  # service key, and that command is the pinned interface. container_name stays
  # on-pattern.
  backup:
    # Daily DB backup sidecar. Same image as db so pg_dump matches the
    # server Postgres exactly, and busybox brings crond — no bespoke image, no
    # postgresql-client in the api image. No docker socket: it reaches Postgres
    # over the compose network (pg_dump -h insuredesk-db-prod), not docker exec.
    image: postgres:17-alpine
    container_name: insuredesk-backup-prod
    restart: unless-stopped
    # `serve` backs up once on start (self-proof) then runs crond. Kept as the
    # command (not baked into entrypoint) so `docker compose run --rm backup once`
    # overrides only the subcommand — the single-shot entry reused for the manual
    # pre-upgrade backup (docs/releasing.md).
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-db.sh"]
    command: ["serve"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # crond reads the 21:30 schedule in local time — must be Asia/Shanghai, not UTC.
      TZ: Asia/Shanghai
    volumes:
      # Host bind mount, not a named volume: `down -v` can't reach it, `ls`/`scp`
      # see it directly, moving off-box later is just `scp`.
      - ${BACKUP_DIR:-${HOME}/backups/insuredesk}:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    healthcheck:
      # Passive visibility only, a knowingly accepted limitation: asserts a
      # backup file newer than 25h exists, else `docker compose ps` shows
      # unhealthy. No active alerting.
      test: ["CMD", "sh", "/usr/local/bin/backup-db.sh", "check"]
      interval: 1h
      timeout: 10s
      retries: 3
      # First backup runs at startup; don't fail the check before it lands.
      start_period: 90s
    depends_on:
      insuredesk-db-prod:
        condition: service_healthy

volumes:
  postgres_data:
    name: insuredesk_postgres_data_prod
