name: Agent PR health

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  requeue-failed-agent-work:
    if: github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'codex/issue-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # type stripping 需要 .nvmrc 钉的 Node ≥22.18,runner 自带版本不够。
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Requeue the issue only when its agent PR failed CI
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/agent/main.ts reconcile-ci "$AGENT_BRANCH"
